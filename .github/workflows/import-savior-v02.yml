name: Import World of Savior v0.2

on:
  push:
    paths:
      - .github/workflows/import-savior-v02.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-game:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download, verify and extract game
        env:
          ARCHIVE_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3C4B9OTGqT5OSJPf57MOvbWzp5x/19b6f017-5e38-42e4-9c3e-c8d85d2755ac.zip
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 3 "$ARCHIVE_URL" -o /tmp/world-of-savior-v02.zip
          echo '27aa7720f4f9bcfca2d70ffabb99a2863dcc3921e48cc8990031da1dc7eb9d83  /tmp/world-of-savior-v02.zip' | sha256sum -c -
          mkdir -p /tmp/savior-import
          unzip -q /tmp/world-of-savior-v02.zip -d /tmp/savior-import
          test -f /tmp/savior-import/World_of_Savior/dist/index.html
          test -f /tmp/savior-import/World_of_Savior/RUN_GAME.py
          cp -a /tmp/savior-import/World_of_Savior/. .
          find dist -type f | wc -l
      - name: Commit extracted individual files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dist RUN_GAME.py START_WINDOWS.bat START_LINUX.sh README_UZ.md ASSETS_V02_UZ.md
          if ! git diff --cached --quiet; then
            git commit -m "Import World of Savior v0.2 playable files and assets"
            git push origin HEAD:main
          else
            echo "All game files already match the repository"
          fi
