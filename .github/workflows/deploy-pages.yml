name: Deploy World of Savior

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish playable web game
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify game files
        run: |
          test -f dist/index.html
          test -f dist/game.js
          test -f dist/style.css
          test -d dist/assets

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload playable game
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
